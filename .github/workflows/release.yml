name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
        
    - name: Create keystore.properties
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "storeFile=release.keystore" >> keystore.properties
        echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
        echo "keyAlias=$KEY_ALIAS" >> keystore.properties
        echo "keyPassword=$KEY_PASSWORD" >> keystore.properties
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build release APK
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Get version name
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        fi
        
    - name: Rename APK
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/SafeKids-v${VERSION}.apk
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: SafeKids v${{ steps.version.outputs.VERSION }}
        body: |
          ## 📱 SafeKids Android v${{ steps.version.outputs.VERSION }}
          
          ### ⬇️ Download করুন
          
          নিচের APK file টি download করে install করুন।
          
          ### 📋 Installation
          
          1. APK download করুন
          2. Settings → Security → "Unknown sources" enable করুন
          3. Downloaded APK install করুন
          4. App খুলে registration সম্পন্ন করুন
          
          ### 🔐 Security
          
          এই APK signed এবং verified। SHA256 fingerprint যাচাই করতে পারেন।
          
          ### 📝 Changelog
          
          Release notes এখানে যোগ করুন...
          
        files: |
          app/build/outputs/apk/release/SafeKids-v${{ steps.version.outputs.VERSION }}.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: safekids-release-apk-v${{ steps.version.outputs.VERSION }}
        path: app/build/outputs/apk/release/SafeKids-v${{ steps.version.outputs.VERSION }}.apk
        retention-days: 90
