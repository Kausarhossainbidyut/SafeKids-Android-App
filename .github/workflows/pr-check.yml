name: PR Build Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Check code style
      run: ./gradlew ktlintCheck || true
      continue-on-error: true
      
    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --stacktrace
      
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Test Results
        path: app/build/test-results/testDebugUnitTest/*.xml
        reporter: java-junit
        
    - name: Comment PR with build status
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const fs = require('fs');
          const buildStatus = '${{ job.status }}' === 'success' ? '✅ Build successful!' : '❌ Build failed!';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## Build Status\n\n${buildStatus}\n\n**Commit:** ${{ github.sha }}\n**Workflow:** ${{ github.workflow }}`
          });
